[workspace]
members = [
    "crates/opencode-core",
    "crates/opencode-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cluster1900/opencode-rs"
publish = false

[workspace.dependencies]
opencode-core = { path = "crates/opencode-core", version = "0.1.0" }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"
