name: release

# Push a tag like v1.2.3 to build the CLI for every target and attach the archives
# to a GitHub Release. Only the built-in GITHUB_TOKEN is needed.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve version
        run: echo "APEXO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Build and upload binaries
        working-directory: packages/apexo
        run: bun run build
        env:
          APEXO_CHANNEL: latest
          APEXO_RELEASE: "1"

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
